[project]
name = "rag-faithfulness-ppi-gate"
version = "0.1.0"
description = "Faithfulness judges for RAG outputs, calibrated against human hallucination spans, with prediction-powered confidence intervals and a pytest gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Lopez" }]
requires-python = ">=3.12,<3.13"
keywords = ["rag", "hallucination", "faithfulness", "nli", "prediction-powered-inference", "calibration", "conformal", "pytest"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
    "jinja2>=3.1",
    "pydantic>=2.8",
]

[project.scripts]
faithgate = "faithgate.cli:main"

[project.entry-points.pytest11]
faithgate = "faithgate.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faithgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]
"bench/**" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the downloaded RAGTruth data or NLI model (run with -m integration)",
]
